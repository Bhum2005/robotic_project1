[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder   ; แปลง backtrace เป็นชื่อฟังก์ชันเวลา crash

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1             ; Serial ออกทางพอร์ต USB native
    -DCORE_DEBUG_LEVEL=3

; ถ้าบอร์ดมี 16MB flash + PSRAM ให้เปิดสองบรรทัดนี้
; board_build.flash_size = 16MB
; board_build.arduino.memory_type = qio_opi

; ถ้ามีหลายบอร์ดเสียบพร้อมกัน ล็อกพอร์ตไว้เลย
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0